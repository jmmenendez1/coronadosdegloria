name: Dry run (calibración)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás a analizar"
        required: false
        default: "30"

permissions:
  contents: write

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rastrear (sin tocar estado)
        run: python3 scraper/scrape.py --dry-run --days "${{ github.event.inputs.days }}"

      - name: Verificar Buttondown y obtener username
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          if [ -z "$BUTTONDOWN_API_KEY" ]; then echo '{"error":"secret no configurado"}' > buttondown.json; exit 0; fi
          curl -s -H "Authorization: Token $BUTTONDOWN_API_KEY" https://api.buttondown.com/v1/newsletters -o /tmp/bd.json || true
          curl -s -H "Authorization: Token $BUTTONDOWN_API_KEY" "https://api.buttondown.com/v1/emails" -o /tmp/bde.json || true
          curl -s -H "Authorization: Token $BUTTONDOWN_API_KEY" "https://api.buttondown.com/v1/subscribers" -o /tmp/bds.json || true
          python3 - <<'EOF'
          import json
          out = {}
          try:
              d = json.load(open('/tmp/bd.json'))
              out = {'ok': True, 'newsletters': [
                  {'username': n.get('username'), 'name': n.get('name')} for n in d.get('results', [])
              ]}
              try:
                  e = json.load(open('/tmp/bde.json'))
                  out['emails'] = [
                      {'subject': m.get('subject'), 'status': m.get('status'), 'created': m.get('creation_date')}
                      for m in e.get('results', [])[-5:]
                  ]
              except Exception:
                  out['emails'] = 'unavailable'
              try:
                  s = json.load(open('/tmp/bds.json'))
                  out['subscriber_count'] = s.get('count', len(s.get('results', [])))
              except Exception:
                  out['subscriber_count'] = 'unavailable'
          except Exception:
              import os
              out = {'ok': False, 'raw': open('/tmp/bd.json').read()[:300] if os.path.exists('/tmp/bd.json') else 'no-response'}
          json.dump(out, open('buttondown.json', 'w'))
          print(json.dumps(out, indent=2))
          EOF

      - name: Publicar resultados en branch calibration
        run: |
          git config user.name "coronacion-bot"
          git config user.email "actions@users.noreply.github.com"
          git switch --orphan calibration
          git add -f candidates.json buttondown.json
          git commit -m "Resultados de calibración"
          git push -f origin calibration
